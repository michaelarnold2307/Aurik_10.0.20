audio:
  chunk_size: 661500
  num_channels: 2
  sample_rate: 44100
  min_mean_abs: 0.000

model:
  sources: ['drums', 'bass', 'other', 'vocals']
  audio_channels: 2
  dims: [4, 64, 128, 256]
  nfft: 4096
  hop_size: 1024
  win_size: 4096
  normalized: True
  band_SR: [0.230, 0.370, 0.400]
  band_stride: [1, 4, 4]
  band_kernel: [3, 4, 4]
  conv_depths: [3, 3, 3]
  compress: 4
  conv_kernel: 3
  num_dplayer: 10
  expand: 1

training:
  batch_size: 1
  gradient_accumulation_steps: 1
  grad_clip: 0
  instruments: ['drums', 'bass', 'other', 'vocals']
  patience: 2
  reduce_factor: 0.95
  target_instrument: null
  num_epochs: 1000
  num_steps: 1000
  q: 0.95
  coarse_loss_clip: true
  ema_momentum: 0.999
  optimizer: adam
  lr: 1.0
  normalize: false # perform normalization on input of model (use the same for inference!)
  other_fix: false # it's needed for checking on multisong dataset if other is actually instrumental
  use_amp: true # enable or disable usage of mixed precision (float16) - usually it must be true

inference:
  batch_size: 4
  dim_t: 1101
  num_overlap: 2