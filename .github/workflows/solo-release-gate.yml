name: Aurik Solo Release Gate

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  solo-spec-evidence-gate:
    name: Solo Spec Evidence Gate
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10.12"

      - name: Enforce evidence artifact for spec changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ -z "${AFTER_SHA}" ]]; then
            AFTER_SHA="$(git rev-parse HEAD)"
          fi
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && ( -z "${BEFORE_SHA}" || "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ) ]]; then
            BEFORE_SHA="$(git rev-parse "${AFTER_SHA}^" 2>/dev/null || true)"
          fi
          if [[ -z "${BEFORE_SHA}" || "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            echo "No parent commit available; skipping spec delta gate."
            exit 0
          fi
          python scripts/spec_evidence_gate.py --base "${BEFORE_SHA}" --head "${AFTER_SHA}"

  normative-guard:
    name: Normative Guard
    runs-on: ubuntu-22.04
    # Der historische Denker-Aufrufvergleich führt die Pipeline zweimal aus;
    # er ist kein E2E-Nachweis der realen GUI- und CLI-Exportpfade.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10.12"
          cache: pip
          cache-dependency-path: requirements/requirements_dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements_dev.txt
          pip install numpy==1.26.4 scipy==1.15.3
          # backend/file_import.py importiert soundfile bereits beim UV3-Import.
          pip install soundfile==0.13.1

      - name: Run compliance and drift checks
        run: |
          python scripts/release_must_coverage_check.py
          python scripts/spec_drift_check.py
          python scripts/compliance_check.py --errors-only

      - name: Run normative tests
        run: |
          python -m pytest \
            tests/normative/test_no_production_stubs.py \
            tests/normative/test_full_pipeline_determinism.py \
            tests/normative/test_p2_audit_and_deployment_mode.py \
            tests/normative/test_cli_gui_output_parity.py \
            --run-heavy-tests \
            -p no:xdist \
            --override-ini="addopts=--strict-markers --import-mode=importlib" \
            --timeout=30 \
            --tb=short \
            -q \
            --disable-warnings \
            --no-header

      - name: Upload release gate reports
        uses: actions/upload-artifact@v6
        with:
          name: solo-release-gate-reports
          path: |
            reports/release_must_coverage.json
            reports/spec_drift_report.json
            reports/spec_drift_baseline.json
