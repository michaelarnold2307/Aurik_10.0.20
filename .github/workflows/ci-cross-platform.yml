name: Aurik CI Cross-Platform

# §15.4: Cross-Platform-Tests (Ubuntu, Windows, macOS)
# Nur bei push auf main oder manuellem Trigger (Kostenkontrolle)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  platform-compat:
    name: Platform Compatibility Check
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Run platform compat check
        run: python scripts/platform_compat_check.py

  test-cross-platform:
    name: Test ${{ matrix.os }} (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    needs: platform-compat
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2022
          - macos-14  # Apple Silicon (M1+), GitHub-hosted
        python:
          - "3.10"
    # Befund 2026-09-14: 30 min reichen nicht — der normative Scope (tests/unit +
    # test_no_production_stubs, ~16,6k Tests) läuft auf den Runnern ~65+ min;
    # die Jobs wurden am 30-min-Limit gecancelt (Sammlung-Fix hatte sie erstmals
    # über die Collection hinaus gebracht).
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 scipy soundfile pytest pytest-timeout pyyaml librosa==0.11.0
          pip install -e . 2>/dev/null || echo "editable install skipped, using PYTHONPATH"

      - name: GPU capability detection
        shell: bash
        run: python scripts/detect_gpu_capabilities.py --json || echo "GPU detection skipped"

      - name: ErrorGuard coverage audit
        shell: bash
        run: python scripts/audit_error_guard_coverage.py --json-only || echo "audit skipped"

      - name: Run cross-platform tests
        shell: bash
        env:
          # Befund 2026-09-14: Windows-Job crashte ~5 min nach Teststart mit
          # SIGSEGV (Exit 139) — numba/LLVM-JIT ist der wahrscheinlichste native
          # Crasher (backend nutzt numba u. a. in musical_goals_metrics, onset_gate,
          # semantic_utils, deadening). JIT aus ⇒ pure-Python-Fallback, Tests bleiben
          # semantisch identisch. Faulthandler dokumentiert den Stack, falls dennoch
          # ein nativer Absturz auftritt.
          NUMBA_DISABLE_JIT: "1"
          PYTHONFAULTHANDLER: "1"
        run: |
          # §Fix 2026-09-08: Der komplette tests/-Baum (19,5k Tests) ist
          # strukturell zu groß (lokal 65 min nur für tests/unit). Normativer
          # Scope (Spec 10_bug_gap_strategy.md, aurik-unit-smoke): tests/unit
          # plus die plattformkritischen Normative-Dateien.
          PYTHONPATH=. pytest tests/unit tests/normative/test_no_production_stubs.py \
            -m "not slow and not gpu and not onnx" \
            --timeout=60 \
            --tb=short \
            --no-header \
            --override-ini="addopts=" \
            -p no:cacheprovider \
            --ignore=tests/normative/test_competitive_ci_gate.py \
            --ignore=tests/normative/test_competitive_stratified_gate.py \
            2>&1 | tail -80

      - name: Quick smoke test
        shell: bash
        run: |
          python -c "
          import numpy as np
          print('numpy:', np.__version__)
          from benchmarks.regression.regression_gate import _make_music, compute_pqs
          music = _make_music(0.5)
          print('PQS self-test:', compute_pqs(music, music))
          print('Smoke test OK')
          "
